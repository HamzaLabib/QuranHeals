name: Quran Heals CI

on:
  # Every branch push (main, release-hardening, any feature branch); tags are
  # not matched by a branches filter, so tag pushes don't trigger a run.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Read-only: CI checks out code and runs tests; it never writes to the repo.
permissions:
  contents: read

# Cancel superseded runs for the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Pinned toolchain (node:sqlite is stable/unflagged on Node 24).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # backend/data/quran/{quran-data.xml,en.pickthall.txt} are third-party
      # Tanzil files kept out of git (see .gitignore and
      # backend/data/quran/README.md). tests/quran-data/full-quran.test.ts
      # loads them via loadCorpus(), which also enforces the SHA-256 pins in
      # src/import/fullQuran.ts. The script copies the XML from the tracked,
      # byte-identical copy, downloads the Pickthall export from the URL in
      # retrieval.json, and refuses any file whose hash differs (same steps
      # developers run locally). Node built-ins only, so it runs before npm ci.
      - name: Restore pinned Tanzil source files
        run: node scripts/restore-quran-sources.mjs

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Mobile (tests + typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
