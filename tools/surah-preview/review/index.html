<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surah Preview Review</title>
<style>
  :root { --bg:#f7f6f2; --panel:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#dedbd2; --accent:#1f6f5c; --warn:#9a5b00; --warnbg:#fff4e0; --bad:#a3271f; --badbg:#fdeceb; --okbg:#e8f4ef; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#20201e; --ink:#ecebe6; --muted:#a3a29b; --line:#3a3935; --accent:#5cc3a6; --warn:#f0b35a; --warnbg:#3a2c14; --bad:#f0857c; --badbg:#3d1e1b; --okbg:#173029; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:1; }
  header h1 { font-size:16px; margin:0; }
  .progress { color:var(--muted); }
  .bar { width:160px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  main { display:grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 50px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } nav { max-height: 40vh; } }
  nav { border-right:1px solid var(--line); overflow:auto; max-height: calc(100vh - 50px); position:sticky; top:50px; }
  .filters { padding:8px; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line); }
  .filters button { font-size:12px; }
  nav ol { list-style:none; margin:0; padding:0; }
  nav li button { width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; color:inherit; padding:7px 10px; display:flex; justify-content:space-between; gap:8px; cursor:pointer; font:inherit; }
  nav li button[aria-current="true"] { background:var(--okbg); }
  .ar { font-family: "Amiri", "Traditional Arabic", "Noto Naskh Arabic", serif; font-size:18px; direction:rtl; }
  .tag { font-size:11px; padding:1px 6px; border-radius:9px; border:1px solid var(--line); white-space:nowrap; }
  .tag.prio { color:var(--warn); border-color:var(--warn); }
  .tag.approved, .tag.accept, .tag.edit { color:var(--accent); border-color:var(--accent); }
  .tag.reject { color:var(--bad); border-color:var(--bad); }
  .tag.stale { color:var(--bad); border-color:var(--bad); }
  .tag.owner { color:var(--muted); }
  section.detail { padding:16px 20px 60px; max-width: 980px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:12px 0; }
  .card h3 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .card.warn { background:var(--warnbg); border-color:var(--warn); }
  .card.notice { background:var(--badbg); border-color:var(--bad); }
  ol.topics { margin:0; padding-right:22px; }
  ol.topics li { margin:2px 0; }
  .omitted { color:var(--muted); }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .meta { color:var(--muted); font-size:12px; word-break:break-all; }
  textarea { width:100%; min-height:120px; font: 17px/1.6 "Amiri","Traditional Arabic",serif; direction:rtl; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  textarea.note { direction:auto; font:14px/1.5 system-ui, sans-serif; min-height:60px; }
  input[type=text] { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); border-color:var(--bad); }
  button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .msg { margin-top:8px; font-size:13px; }
  .msg.err { color:var(--bad); }
  .msg.ok { color:var(--accent); }
  table.hist { width:100%; border-collapse:collapse; font-size:12px; }
  table.hist td, table.hist th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
</style>
</head>
<body>
<header>
  <h1>Surah Preview — Topics scholarly review</h1>
  <span class="progress" id="progress"></span>
  <label>Reviewer <input type="text" id="reviewer" maxlength="80" placeholder="Your full name" autocomplete="name"></label>
</header>
<main>
  <nav>
    <div class="filters" id="filters"></div>
    <ol id="list"></ol>
  </nav>
  <section class="detail" id="detail"></section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) node.addEventListener(ev, fn);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat()) if (child != null && child !== false) node.append(child instanceof Node ? child : String(child));
  return node;
};
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let S = null;
let selected = Number(store.get('sp-review-surah')) || 1;
let filter = store.get('sp-review-filter') || 'all';
const FILTERS = [['all', 'All 114'], ['priority', 'Priority'], ['long', 'Long lists'], ['undecided', 'Undecided'], ['decided', 'Decided'], ['stale', 'Stale']];

$('reviewer').value = store.get('sp-review-reviewer') || '';
$('reviewer').addEventListener('input', (e) => store.set('sp-review-reviewer', e.target.value));

const decisionOf = (r) => S.latest[r.surah] ?? null;
const ownerOk = (r) => !!r.ownerApproval && r.ownerApproval.purpose && r.ownerApproval.topics;
const isStale = (r) => { const d = decisionOf(r); return !!d && d.reviewedSha !== r.currentSha; };
const isDecided = (r) => { const d = decisionOf(r); return !!d && d.reviewedSha === r.currentSha; };
const matches = (r) => filter === 'all' || (filter === 'priority' && r.priority.length) || (filter === 'long' && r.current && r.current.length > 10)
  || (filter === 'undecided' && !isDecided(r)) || (filter === 'decided' && isDecided(r)) || (filter === 'stale' && isStale(r));

async function load() {
  const res = await fetch('/api/state', { cache: 'no-store' });
  S = await res.json();
  render();
}

function render() {
  const p = S.progress;
  $('progress').replaceChildren(el('span', { class: 'bar' }, el('i', { style: `width:${(100 * p.decided / p.total).toFixed(1)}%` })), ` ${p.decided} / ${p.total} scholarly decisions in force · ${p.decisions} recorded · owner approved (editorial) ${S.records.filter(ownerOk).length} / ${p.total}`);
  $('filters').replaceChildren(...FILTERS.map(([key, label]) => el('button', { 'aria-pressed': String(filter === key), on: { click: () => { filter = key; store.set('sp-review-filter', key); render(); } } }, label)));
  const shown = S.records.filter(matches);
  $('list').replaceChildren(...shown.map((r) => {
    const d = decisionOf(r);
    return el('li', {}, el('button', { 'aria-current': String(r.surah === selected), on: { click: () => { selected = r.surah; store.set('sp-review-surah', String(r.surah)); render(); window.scrollTo(0, 0); } } },
      el('span', {}, `${r.surah}. `, el('span', { class: 'ar', style: 'font-size:15px' }, r.nameAr), ` ${r.nameEn}`),
      el('span', {}, r.priority.length ? el('span', { class: 'tag prio' }, 'priority') : null, ' ',
        d ? el('span', { class: `tag ${isStale(r) ? 'stale' : d.action}` }, isStale(r) ? 'stale' : d.action) : null)));
  }));
  renderDetail(S.records[selected - 1]);
}

const topicList = (items, cls = '') => items && items.length ? el('ol', { class: `topics ar ${cls}`, dir: 'rtl' }, items.map((t) => el('li', {}, t))) : el('p', { class: 'meta' }, 'None.');

function renderDetail(r) {
  const d = decisionOf(r);
  const history = S.history[r.surah] ?? [];
  const msg = el('div', { class: 'msg', role: 'status' });
  const editBox = el('textarea', { dir: 'rtl', 'aria-label': 'Edited topics, one per line' });
  editBox.value = (d && d.items && !isStale(r) ? d.items : r.current ?? []).join('\n');
  const note = el('textarea', { class: 'note', maxlength: '2000', placeholder: 'Note (reason, reference checked, …) — optional, kept with the decision' });

  async function decide(action, extra = {}) {
    const reviewer = $('reviewer').value.trim();
    if (!reviewer) { msg.className = 'msg err'; msg.textContent = 'Enter your name as reviewer first (top of the page).'; $('reviewer').focus(); return; }
    const labels = { accept: 'Accept', edit: 'Save edit', reject: 'Reject', skip: 'Skip' };
    if (action !== 'skip' && !confirm(`${labels[action]} the Topics of Surah ${r.surah} (${r.nameEn}) as ${reviewer}?\nThis is recorded as your scholarly decision.`)) return;
    const body = { reviewer, surah: r.surah, action, reviewedSha: r.currentSha, note: note.value.trim() || null, ...extra };
    const res = await fetch('/api/decisions', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Review-Client': 'surah-preview-dashboard' }, body: JSON.stringify(body) });
    const out = await res.json();
    if (!res.ok) { msg.className = 'msg err'; msg.textContent = out.error; return; }
    await load();
    if (action === 'skip') {
      const next = S.records.find((x) => x.surah > r.surah && matches(x) && !isDecided(x));
      if (next) { selected = next.surah; store.set('sp-review-surah', String(next.surah)); render(); }
    }
  }

  const nodes = [
    el('h2', {}, `${r.surah}. `, el('span', { class: 'ar' }, `سورة ${r.nameAr}`), ` — ${r.nameEn}`),
    el('p', { class: 'meta' }, `${r.revelation === 'makki' ? 'Makki' : 'Madani'} · ${r.ayahCount} ayahs · topics from ${r.sourceKind === 'quranpedia' ? 'Quranpedia «موضوعاتها»' : r.sourceKind === 'basair' ? '«بصائر ذوي التمييز»' : 'no source'} · in the app now: ${r.inAppStatus}`),
    el('div', { class: 'card' }, el('h3', {}, 'Owner approval (editorial — not a scholarly review, not a publisher permission)'),
      r.ownerApproval ? el('p', {}, `Main Purpose: ${r.ownerApproval.purpose ? 'approved' : 'wording changed since approval — needs the owner again'} · Topics (as shown in the app): ${r.ownerApproval.topics ? 'approved' : 'wording changed since approval — needs the owner again'} — ${r.ownerApproval.by}, ${r.ownerApproval.on}`) : el('p', { class: 'meta' }, 'Not recorded.')),
    S.logError ? el('div', { class: 'card notice' }, el('h3', {}, 'Review log problem'), S.logError) : null,
    S.missing.length ? el('div', { class: 'card notice' }, el('h3', {}, 'Missing source files'), S.missing.join(', ')) : null,
    r.priority.length || r.warnings.length ? el('div', { class: 'card warn' }, el('h3', {}, 'To check'),
      el('ul', {}, r.priority.map((p) => el('li', {}, el('strong', {}, 'Priority: '), p)), r.warnings.map((w) => el('li', {}, w)))) : null,
    d ? el('div', { class: `card ${isStale(r) ? 'notice' : ''}` }, el('h3', {}, 'Decision in force'),
      el('p', {}, `#${d.seq} ${d.action}${d.basis ? ` (${d.basis})` : ''} by ${d.reviewer}, ${new Date(d.at).toLocaleString()}`),
      isStale(r) ? el('p', {}, el('strong', {}, 'Stale: '), 'the source topics changed after this decision; it will not be applied. Review again.') : null,
      d.items ? topicList(d.items) : null, d.note ? el('p', { class: 'meta' }, `Note: ${d.note}`) : null) : null,
    el('div', { class: 'card' }, el('h3', {}, 'Main purpose (المختصر — read only, not under review)'), el('p', { class: 'ar', dir: 'rtl' }, r.purpose ?? '—')),
    el('div', { class: 'grid2' },
      el('div', { class: 'card' }, el('h3', {}, `Current topics (${r.current ? r.current.length : 0}) — as extracted from the source`), topicList(r.current),
        JSON.stringify(r.inApp) !== JSON.stringify(r.current) ? el('p', { class: 'meta' }, `The app currently shows something else (${r.inAppStatus}):`) : null,
        JSON.stringify(r.inApp) !== JSON.stringify(r.current) ? topicList(r.inApp) : null),
      el('div', { class: 'card' }, el('h3', {}, 'Original source text (verbatim)'), el('div', { class: 'ar', dir: 'rtl', style: 'font-size:16px' }, r.sourceText.map((line) => el('p', { style: 'margin:3px 0' }, line))))),
    r.proposal ? el('div', { class: 'card' }, el('h3', {}, `Proposed concise topics — ${r.proposal.kind}, pending human review (not shown in the app)`),
      el('p', { class: 'meta' }, `Rule: ${r.proposal.rule}`), topicList(r.proposal.items),
      r.proposal.omitted.length ? el('details', {}, el('summary', {}, `Omitted in this proposal (${r.proposal.omitted.length})`), topicList(r.proposal.omitted, 'omitted')) : null) : null,
    el('div', { class: 'card' }, el('h3', {}, 'References & provenance'),
      el('p', { class: 'ar', dir: 'rtl', style: 'font-size:15px' }, r.references.citation ?? 'No citation in the source.'),
      el('ul', { class: 'meta' }, r.references.sources.map((s) => el('li', {}, `${s.id}: ${s.title ?? ''} — ${s.publisher ?? ''} ${s.url ?? ''} (${s.retrieved ?? ''})`))),
      el('p', { class: 'meta' }, `Quranpedia dump ${r.references.dumpVersion} · sha256 ${r.references.dumpSha256}${r.references.basairSha256 ? ` · «بصائر» sha256 ${r.references.basairSha256}` : ''} · reviewed topics sha256 ${r.currentSha}`)),
    el('div', { class: 'card' }, el('h3', {}, 'Your decision'),
      el('p', { class: 'meta' }, 'Only your explicit decision here can mark these Topics approved. Automated checks and proposals are not approvals. Decisions are appended to the review log and never overwritten; a later decision supersedes an earlier one.'),
      note,
      el('div', { class: 'actions' },
        el('button', { class: 'primary', disabled: !r.current, on: { click: () => decide('accept', { basis: 'current', items: r.current }) } }, 'Accept current topics'),
        r.proposal ? el('button', { class: 'primary', on: { click: () => decide('accept', { basis: 'proposal', items: r.proposal.items }) } }, 'Accept proposal') : null,
        el('button', { class: 'danger', on: { click: () => decide('reject') } }, 'Reject (show no topics)'),
        el('button', { on: { click: () => decide('skip') } }, 'Skip for now')),
      el('details', { style: 'margin-top:10px' }, el('summary', {}, 'Edit — one topic per line'), editBox,
        el('div', { class: 'actions' }, el('button', { class: 'primary', on: { click: () => decide('edit', { items: editBox.value.split('\n').map((l) => l.trim()).filter(Boolean) }) } }, 'Save edited topics'))),
      msg),
    history.length ? el('div', { class: 'card' }, el('h3', {}, `History (${history.length})`),
      el('table', { class: 'hist' }, el('tr', {}, el('th', {}, '#'), el('th', {}, 'When'), el('th', {}, 'Reviewer'), el('th', {}, 'Decision'), el('th', {}, 'Note')),
        history.slice().reverse().map((h) => el('tr', {}, el('td', {}, h.seq), el('td', {}, new Date(h.at).toLocaleString()), el('td', {}, h.reviewer), el('td', {}, `${h.action}${h.basis ? ` (${h.basis})` : ''}${h.reviewedSha !== r.currentSha ? ' — stale' : ''}`), el('td', {}, h.note ?? ''))))) : null,
  ];
  $('detail').replaceChildren(...nodes.filter(Boolean));
}

load().catch((e) => { $('detail').textContent = `Could not load: ${e.message}`; });
</script>
</body>
</html>
